apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  ports:
    - name: query
      port: 16686
      targetPort: 16686
    - name: collector-http
      port: 14268
      targetPort: 14268
    - name: agent
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
  selector:
    app: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          ports:
            - containerPort: 16686
              name: query
            - containerPort: 14268
              name: collector
            - containerPort: 6831
              name: agent
              protocol: UDP
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"